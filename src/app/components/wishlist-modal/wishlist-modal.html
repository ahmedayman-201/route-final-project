<!-- Wishlist Modal -->
<div class="modal fade" [class.show]="isOpen" [style.display]="isOpen ? 'block' : 'none'" tabindex="-1" *ngIf="isOpen">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-heart me-2"></i>
          Wishlist ({{ wishlistItems.length }} items)
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <!-- Empty Wishlist -->
        <div *ngIf="wishlistItems.length === 0" class="text-center py-5">
          <i class="fas fa-heart fa-3x text-muted mb-3"></i>
          <h5>Your wishlist is empty</h5>
          <p class="text-muted">Add some products to your wishlist!</p>
          <button class="btn btn-primary" (click)="closeModal()">Continue Shopping</button>
        </div>

        <!-- Wishlist Items -->
        <div *ngIf="wishlistItems.length > 0">
          <div class="wishlist-item" *ngFor="let item of wishlistItems">
            <div class="row align-items-center">
              <!-- Product Image -->
              <div class="col-md-2">
                <img [src]="item.imageCover" [alt]="item.title" class="item-image">
              </div>

              <!-- Product Details -->
              <div class="col-md-4">
                <h6 class="item-title">{{ item.title }}</h6>
                <p class="item-price">{{ formatPrice(item.price) }}</p>
              </div>

              <!-- Product Category -->
              <div class="col-md-2">
                <small class="text-muted">{{ item.category.name }}</small>
              </div>

              <!-- Product Brand -->
              <div class="col-md-2">
                <small class="text-muted">{{ item.brand.name }}</small>
              </div>

              <!-- Action Buttons -->
              <div class="col-md-2">
                <div class="d-grid gap-2">
                  <button class="btn btn-primary btn-sm" (click)="addToCartClick(item._id)">
                    <i class="fas fa-shopping-cart me-1"></i>
                    Add to Cart
                  </button>
                  <button class="btn btn-outline-danger btn-sm" (click)="removeFromWishlistClick(item._id)">
                    <i class="fas fa-trash me-1"></i>
                    Remove
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer" *ngIf="wishlistItems.length > 0">
        <div class="w-100 text-center">
          <button class="btn btn-outline-secondary" (click)="closeModal()">
            Continue Shopping
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="isOpen"></div>
