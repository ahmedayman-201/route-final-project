<!-- Header -->
<header class="header">
  <div class="container-fluid">
    <div class="row align-items-center py-2">
      <!-- Logo -->
      <div class="col-auto">
        <a class="navbar-brand" href="#" (click)="$event.preventDefault()">
          <i class="fas fa-cloud me-2"></i>
          Cloud Store
        </a>
      </div>

      <!-- Search Bar -->
      <div class="col">
        <div class="search-container">
          <div class="input-group">
            <input 
              type="text" 
              class="form-control search-input" 
              placeholder="Search for products..."
              [(ngModel)]="searchTerm"
              (keyup.enter)="onSearch()"
              (input)="onSearchInput()">
            <button 
              class="btn search-btn" 
              type="button" 
              (click)="onSearch()">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Navigation Icons -->
      <div class="col-auto">
        <div class="nav-icons">
          <!-- Wishlist -->
          <a 
            href="#" 
            class="nav-icon position-relative" 
            (click)="openWishlist($event)"
            title="Wishlist">
            <i class="far fa-heart"></i>
            <span class="nav-text">Wishlist</span>
            <span *ngIf="wishlistCount > 0" class="badge">{{ wishlistCount }}</span>
          </a>

          <!-- Cart -->
          <a 
            href="#" 
            class="nav-icon position-relative" 
            (click)="openCart($event)"
            title="Shopping Cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="nav-text">Cart</span>
            <span *ngIf="cartCount > 0" class="badge">{{ cartCount }}</span>
          </a>

          <!-- User Account -->
          <div class="nav-icon dropdown" *ngIf="isLoggedIn; else guestUser">
            <a 
              href="#" 
              class="dropdown-toggle" 
              data-bs-toggle="dropdown" 
              (click)="$event.preventDefault()"
              title="Account">
              <i class="far fa-user"></i>
              <span class="nav-text">{{ user?.name || 'Account' }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><h6 class="dropdown-header">{{ user?.name }}</h6></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" (click)="openProfile($event)">Profile</a></li>
              <li><a class="dropdown-item" href="#" (click)="openOrders($event)">Orders</a></li>
              <li><a class="dropdown-item" href="#" (click)="openSettings($event)">Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" (click)="logout($event)">Logout</a></li>
            </ul>
          </div>

          <!-- Guest User -->
          <ng-template #guestUser>
            <a 
              href="#" 
              class="nav-icon" 
              (click)="openAuth($event)"
              title="Login / Register">
              <i class="far fa-user"></i>
              <span class="nav-text">Account</span>
            </a>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- Secondary Navigation -->
    <div class="row">
      <div class="col-12">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">
            <button 
              class="navbar-toggler" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navbarNav">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav me-auto">
                <li class="nav-item">
                  <a class="nav-link" href="#" (click)="scrollToSection('categories', $event)">Categories</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#" (click)="scrollToSection('brands', $event)">Brands</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#" (click)="scrollToSection('products', $event)">Products</a>
                </li>
                <li class="nav-item dropdown">
                  <a 
                    class="nav-link dropdown-toggle" 
                    href="#" 
                    data-bs-toggle="dropdown">
                    More
                  </a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" (click)="openAbout($event)">About Us</a></li>
                    <li><a class="dropdown-item" href="#" (click)="openContact($event)">Contact</a></li>
                    <li><a class="dropdown-item" href="#" (click)="openHelp($event)">Help</a></li>
                  </ul>
                </li>
              </ul>
              
              <!-- Guest Login Option -->
              <div class="navbar-nav" *ngIf="!isLoggedIn">
                <div class="nav-item">
                  <button 
                    class="btn btn-outline-primary btn-sm me-2" 
                    (click)="loginAsGuest()">
                    Continue as Guest
                  </button>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
